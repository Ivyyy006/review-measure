<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Measure v3 — event listener diagnostic (clone only)</title>
<style>
  html,body{margin:0;padding:0;background:#fff;color:#1a1a1a;font-family:Arial,sans-serif;}
  #wrap{padding:10px;}
  h1{font-size:15px;margin:0 0 6px;}
  h2{font-size:13px;margin:12px 0 4px;}
  #status{font-size:13px;margin:0 0 8px;color:#444;}
  button{font-size:13px;padding:6px 12px;margin:0 6px 8px 0;cursor:pointer;}
  table{border-collapse:collapse;width:100%;font-size:12px;}
  th,td{border:1px solid #bbb;padding:3px 5px;vertical-align:top;text-align:left;}
  th{background:#eee;}
  td.qid{font-weight:bold;white-space:nowrap;}
  td.val{font-family:Menlo,Consolas,monospace;word-break:break-word;white-space:pre-wrap;}
  tr.empty td{color:#999;}
  #log{font-family:Menlo,Consolas,monospace;font-size:11px;white-space:pre-wrap;word-break:break-word;border:1px solid #bbb;padding:6px;background:#fafafa;max-height:500px;overflow:auto;}
</style>
<script src="https://cdn.jotfor.ms/s/umd/latest/for-custom-widgets.js"></script>
</head>
<body>
<div id="wrap">
  <h1>Review Measure v3 — change-event listener diagnostic (CLONE ONLY)</h1>
  <p id="status">Waiting for Jotform ready…</p>
  <button id="getknown" type="button">GET KNOWN IDS NOW (33, 28, 56)</button>
  <button id="clearlog" type="button">CLEAR LOG</button>
  <h2>Change events received (raw)</h2>
  <div id="log">(none yet)</div>
  <h2>Latest value per field (from change events)</h2>
  <table>
    <thead><tr><th>QID</th><th>Latest event value (JSON)</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<script>
(function(){
  "use strict";
  var MAX_ID = 140;
  var statusEl = document.getElementById('status');
  var rowsEl = document.getElementById('rows');
  var logEl = document.getElementById('log');
  var latest = {};   // qid -> raw payload of last change event
  var lines = [];
  var connected = false;
  var subscribed = 0;

  function resize(){
    try{
      if(window.JFCustomWidget && JFCustomWidget.requestFrameResize){
        JFCustomWidget.requestFrameResize({ height: Math.ceil(document.body.getBoundingClientRect().height) + 24 });
      }
    }catch(e){}
  }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function stringify(v){ try{ return JSON.stringify(v); }catch(e){ return String(v); } }

  function render(){
    var ids = Object.keys(latest).sort(function(a,b){ return (+a)-(+b); });
    var html = "";
    ids.forEach(function(id){
      html += '<tr><td class="qid">'+esc(id)+'</td><td class="val">'+esc(stringify(latest[id]).slice(0,500))+'</td></tr>';
    });
    if(!ids.length) html = '<tr class="empty"><td colspan="2">No change events yet.</td></tr>';
    rowsEl.innerHTML = html;
    statusEl.textContent = 'Listening. Fields with change events so far: '+ids.length+'. Subscriptions attempted: '+subscribed+'. Last update: '+new Date().toLocaleTimeString();
    resize();
  }
  function log(tag, payload){
    lines.push(tag + " => " + stringify(payload).slice(0, 700));
    if(lines.length > 120) lines.shift();
    logEl.textContent = lines.join("\n\n");
  }

  function onChange(qid){
    return function(payload){
      latest[qid] = payload;
      log("CHANGE input_"+qid, payload);
      render();
    };
  }

  function subscribeAll(){
    if(!window.JFCustomWidget || typeof JFCustomWidget.listenFromField !== "function"){
      log("listenFromField", "NOT A FUNCTION on this bridge");
      return;
    }
    for(var id=1; id<=MAX_ID; id++){
      try{ JFCustomWidget.listenFromField("input_"+id, "change", onChange(String(id))); subscribed++; }
      catch(e){ log("subscribe input_"+id+" ERROR", String(e)); }
    }
    render();
  }

  function getKnown(){
    if(!connected) return;
    ["33","28","56"].forEach(function(id){
      try{
        JFCustomWidget.getFieldsValueById([id], function(d){ log("GET["+id+"]", d); });
      }catch(e){ log("GET["+id+"] ERROR", String(e)); }
    });
  }

  document.getElementById('getknown').addEventListener('click', getKnown);
  document.getElementById('clearlog').addEventListener('click', function(){ lines = []; logEl.textContent = "(cleared)"; });

  if(window.JFCustomWidget && typeof JFCustomWidget.subscribe === "function"){
    JFCustomWidget.subscribe("ready", function(){
      connected = true;
      statusEl.textContent = "Connected. Subscribing to change events for all fields…";
      subscribeAll();
      render();
    });
  } else {
    statusEl.textContent = "JFCustomWidget unavailable — open inside a Jotform form.";
  }
})();
</script>
</body>
</html>
