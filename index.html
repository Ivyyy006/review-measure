<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Measure — diagnostic (clone only)</title>
<style>
  html,body{margin:0;padding:0;background:#fff;color:#1a1a1a;font-family:Arial,sans-serif;}
  #wrap{padding:10px;}
  h1{font-size:15px;margin:0 0 6px;}
  #status{font-size:13px;margin:0 0 8px;color:#444;}
  button{font-size:13px;padding:6px 12px;margin:0 6px 8px 0;cursor:pointer;}
  table{border-collapse:collapse;width:100%;font-size:12px;}
  th,td{border:1px solid #bbb;padding:3px 5px;vertical-align:top;text-align:left;}
  th{background:#eee;}
  td.qid{font-weight:bold;white-space:nowrap;}
  td.val{font-family:Menlo,Consolas,monospace;word-break:break-word;white-space:pre-wrap;}
  tr.empty td{color:#999;}
</style>
<script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>
</head>
<body>
<div id="wrap">
  <h1>Review Measure — field read diagnostic (CLONE ONLY)</h1>
  <p id="status">Waiting for Jotform ready…</p>
  <button id="rescan" type="button">RE-SCAN ALL FIELDS</button>
  <table>
    <thead><tr><th>QID</th><th>Returned value (JSON)</th><th>Type</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<script>
(function(){
  "use strict";
  var MAX_ID = 140;
  var statusEl = document.getElementById('status');
  var rowsEl = document.getElementById('rows');
  var results = {}; // qid -> {value:..., type:...}
  var connected = false;

  function resize(){
    try{
      if(window.JFCustomWidget && JFCustomWidget.requestFrameResize){
        JFCustomWidget.requestFrameResize({ height: Math.ceil(document.body.getBoundingClientRect().height) + 24 });
      }
    }catch(e){}
  }

  function stringify(v){
    try{ return JSON.stringify(v); }catch(e){ return String(v); }
  }

  function render(){
    var html = '';
    var found = 0;
    for(var id=1; id<=MAX_ID; id++){
      var r = results[String(id)];
      if(r && r.present){ found++; }
      html += '<tr class="'+((r&&r.present)?'':'empty')+'">'
        + '<td class="qid">'+id+'</td>'
        + '<td class="val">'+(r? escapeHtml(r.text) : '—')+'</td>'
        + '<td>'+(r? escapeHtml(r.type) : '—')+'</td></tr>';
    }
    rowsEl.innerHTML = html;
    statusEl.textContent = 'Scan complete. Fields returning data: '+found+' of '+MAX_ID+' probed. '
      + 'Last scan: '+new Date().toLocaleTimeString();
    resize();
  }

  function escapeHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function probe(ids, done){
    JFCustomWidget.getFieldsValueById(ids, function(data){
      if(data && typeof data === 'object'){
        Object.keys(data).forEach(function(k){
          var v = data[k];
          var present = !(v === null || v === undefined || v === '' ||
            (typeof v === 'object' && Object.keys(v).length === 0));
          results[String(k)] = {
            present: present,
            text: stringify(v).slice(0, 400),
            type: (v === null ? 'null' : (Array.isArray(v) ? 'array' : typeof v))
          };
        });
      }
      done && done();
    });
  }

  function scan(){
    if(!connected){ statusEl.textContent = 'Not connected to Jotform yet.'; return; }
    statusEl.textContent = 'Scanning…';
    var batches = [];
    for(var start=1; start<=MAX_ID; start+=20){
      var batch = [];
      for(var i=start; i<start+20 && i<=MAX_ID; i++) batch.push(String(i));
      batches.push(batch);
    }
    var idx = 0;
    (function next(){
      if(idx >= batches.length){ render(); return; }
      probe(batches[idx++], next);
    })();
  }

  document.getElementById('rescan').addEventListener('click', scan);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) scan(); });
  window.addEventListener('focus', scan);

  if(window.JFCustomWidget && typeof JFCustomWidget.subscribe === 'function'){
    JFCustomWidget.subscribe('ready', function(){
      connected = true;
      statusEl.textContent = 'Connected. Running first scan…';
      scan();
      setTimeout(scan, 1500);
    });
  } else {
    statusEl.textContent = 'JFCustomWidget unavailable — open this widget inside a Jotform form.';
  }
})();
</script>
</body>
</html>
