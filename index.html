<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Answers — display widget v1.16 (clone build)</title>
<style>
  :root{
    --forest:#244536; --gold:#C3A263; --ivory:#F8F6F0; --sage:#DCE5DA;
    --charcoal:#303849; --answer:#587C46; --ink:#182D3C;
  }
  html,body{margin:0;padding:0;background:transparent;}
  body{font-family:'Caudex',Georgia,serif;color:var(--charcoal);}
  #reviewRoot{background:#fff;border:1px solid var(--sage);border-radius:14px;
    padding:22px 20px 18px;max-width:640px;margin:0 auto;box-sizing:border-box;}
  h1.welcome{font-size:21px;line-height:1.3;color:var(--forest);margin:0 0 8px;font-weight:700;}
  p.welcome-body{font-size:14.5px;line-height:1.55;margin:0 0 18px;color:var(--charcoal);}
  .row{padding:10px 0;border-top:1px solid var(--ivory);}
  .row:first-of-type{border-top:none;}
  .q{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);
     font-weight:700;margin:0 0 3px;}
  .a{font-size:16px;line-height:1.45;color:var(--charcoal);margin:0;white-space:pre-wrap;}
  .a ul{margin:2px 0 0;padding-left:18px;}
  .a li{margin:1px 0;}
  .bubble{background:var(--ivory);border:1px solid var(--sage);border-radius:12px;
    padding:14px 16px;margin:16px 0 6px;}
  .bubble h2{font-size:17px;color:var(--forest);margin:0 0 5px;font-weight:700;}
  .bubble p{font-size:14.5px;line-height:1.55;margin:0;}
  .contact{margin-top:14px;border-top:2px solid var(--sage);padding-top:12px;}
  .loading{font-size:14px;color:#777;margin:6px 0;}
  .printbar{text-align:center;padding:16px 0 4px;}
  .printbtn{display:inline-block;background:transparent;border:none;cursor:pointer;
    font-family:'Caudex',Georgia,serif;font-size:18px;color:var(--charcoal);
    text-decoration:none;padding:10px 18px 12px;line-height:1;}
  .printbtn .u{display:block;width:104px;height:9px;margin:2px auto 0;
    border-bottom:2px solid var(--gold);border-radius:50%;}
</style>
<script src="https://cdn.jotfor.ms/s/umd/latest/for-custom-widgets.js"></script>
</head>
<body>
<div id="reviewRoot">
  <p class="loading" id="loadingMsg">Loading your answers…</p>
  <div id="content" style="display:none">
    <div id="rows"></div>
    <div class="bubble" id="bubble" style="display:none">
      <h2 id="bubbleHeading"></h2>
      <p id="bubbleBody"></p>
    </div>
    <div class="contact" id="contactRows"></div>
    <div id="referralRows"></div>
    <div class="printbar"><button class="printbtn" id="printBtn" type="button">Print<span class="u"></span></button></div>
  </div>
</div>
<script>
(function(){
  "use strict";
  /* Read map: direct unique names for bridge-readable fields; MIRROR
     unique names for choice/appointment answers (proven on clone
     263031945610148, Oct 31 2026 — see review-measure-results-oct-31.md).
     Start date: mirrors 98/99 primary; calendar events (input_72/73)
     as fallback. */
  var NAMES = {
    reason:"q89_mirrorReason", status:"q90_mirrorStatus",
    provider:"q62_whoIs", providerOther:"q63_typeA63",
    people:"q15_howMany", zip:"q39_whatIs39", county:"q34_whatCounty",
    income:"q91_mirrorIncome", taxHousehold:"q17_howMany17",
    priorities:"q92_mirrorPriorities", addonGate:"q93_mirrorAddon",
    addons:"q94_mirrorAddons", premium:"q95_mirrorPremium",
    timeframe:"q96_mirrorTimeframe",
    startDate45:"q98_typeA98", startDate46:"q99_typeA99",
    fullName:"q10_name", phone:"q11_phoneNumber", email:"q12_email",
    appointment:"q97_mirrorAppointment",
    referredBy:"q37_whoCan", referrerPhone:"q36_phoneNumber36"
  };
  var BUBBLES = {
    within45:{ heading:"Let's Get Connected!",
      body:"Expect a call from us soon to discuss your coverage preferences, answer any questions you may have, and explore your options." },
    over45:{ heading:"Let's Stay in Touch",
      body:"Thank you for sharing your coverage preferences! Since your desired start date is a little further out, we'll reach out closer to your preferred date to review your options and help you take the next step." }
  };
  var values = {};       // key -> string
  var calendarEvt = {};  // 72/73 -> value from change events (fallback)

  function resize(){
    try{
      if(window.JFCustomWidget && JFCustomWidget.requestFrameResize){
        JFCustomWidget.requestFrameResize({ height: document.getElementById('reviewRoot').offsetHeight + 8 });
      }
    }catch(e){}
  }
  function isEmpty(v){
    return v === null || v === undefined || (typeof v === "string" && v.trim() === "") ||
      (typeof v === "object" && Object.keys(v).length === 0);
  }
  function toText(v){
    if(isEmpty(v)) return "";
    if(typeof v === "string") return v;
    if(Array.isArray(v)) return v.filter(function(x){ return !isEmpty(x); }).join(", ");
    if(typeof v === "object"){
      // fullname / phone style objects: join their non-empty parts
      var parts = [];
      ["first","middle","last","full","area","phone","number"].forEach(function(k){
        if(!isEmpty(v[k])) parts.push(String(v[k]));
      });
      if(parts.length) return parts.join(" ");
      return Object.keys(v).map(function(k){ return v[k]; }).filter(function(x){ return !isEmpty(x); }).join(" ");
    }
    return String(v);
  }
  function formatDate(raw){
    // Calendar widgets display MM.DD.YYYY to the person; mirrors may hold
    // ISO (yyyy-mm-dd) — normalize to what the person saw.
    var s = toText(raw).trim();
    var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m) return m[2]+"."+m[3]+"."+m[1];
    return s;
  }
  function isOver45(){
    var tf = (values.timeframe || "");
    return /more than/i.test(tf);
  }
  function startDate(){
    /* Branch decides which date counts: the other branch's calendar
       keeps its old answer in its mirror after a mid-form switch, so
       never fall across branches. */
    var v, evt;
    if(isOver45()){ v = values.startDate46; evt = calendarEvt["73"]; }
    else { v = values.startDate45; evt = calendarEvt["72"]; }
    if(isEmpty(v)) v = evt || "";
    return formatDate(v);
  }

  function rowHTML(heading, answer, asList){
    if(isEmpty(answer)) return "";   /* hide unanswered rows (switchable rule) */
    var body;
    if(asList){
      var items = String(answer).split(/,\s*/).filter(Boolean);
      body = "<ul>" + items.map(function(i){ return "<li>"+escapeHtml(i)+"</li>"; }).join("") + "</ul>";
    } else {
      body = escapeHtml(String(answer));
    }
    return '<div class="row"><p class="q">'+escapeHtml(heading)+'</p><div class="a">'+body+'</div></div>';
  }
  function escapeHtml(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function collectRows(id){
    /* Snapshot exactly what the card is showing (headings + rendered
       answer HTML) so the print page reproduces the card 1:1. */
    var out = [], el = document.getElementById(id);
    if(!el) return out;
    var rows = el.querySelectorAll('.row');
    for(var i=0;i<rows.length;i++){
      var q = rows[i].querySelector('.q'), a = rows[i].querySelector('.a');
      if(q && a) out.push({ h:q.textContent, html:a.innerHTML });
    }
    return out;
  }
  document.getElementById('printBtn').addEventListener('click', function(){
    /* TAX's final design (2026-11-01): ONE tap on the card's Print
       button prints the review — no popup step, no tab, nothing
       leaves the form. The print page in field 102's frame already
       holds these answers (the feeder's 2.5s poll keeps it
       current); refresh it once more, then print the form page.
       The form's @media print rules isolate that frame, so the
       sheet is the review exactly as the print page lays it out —
       the layout that printed perfectly as a tab in v1.5, now
       sourced from inside the form.
       v1.13: the print call is SYNCHRONOUS, inside the tap itself.
       v1.12 delayed it 350ms and the sheet never fired in testing
       (browsers can drop a print call that arrives detached from
       the user gesture); v1.7's immediate call from this same card
       fired every time.
       v1.14's diagnostic settled it: MARK SEEN — the tap reaches
       this handler (the button flipped to "Printing…") and the
       print call then opened the browser's print sheet (the
       modal dialog the test browser cannot display, which froze
       its clicks exactly as in the v1.7 tests). v1.15 is the
       clean shipping build: same handler, diagnostic marks
       removed. */
    updatePrintFrame();
    try{ window.print(); }catch(e){}
  });
  var lastPrintHash = "";
  function updatePrintFrame(){
    /* The print popup (a paragraph modal, the Privacy Policy pattern)
       holds an iframe with the print page. That page lives on the
       same GitHub origin as this widget, so this frame can find the
       sibling print frame among the form's frames and hand it the
       current answers through its hash; the print page re-renders on
       every hash change. The form page itself is never touched. */
    try{
      var payload = { rows:collectRows('rows'), contact:collectRows('contactRows'),
        referral:collectRows('referralRows'), bubble:null };
      var bubble = document.getElementById('bubble');
      if(bubble && bubble.style.display !== "none"){
        payload.bubble = { h:document.getElementById('bubbleHeading').textContent,
                           p:document.getElementById('bubbleBody').textContent };
      }
      var hash = encodeURIComponent(JSON.stringify(payload));
      if(hash === lastPrintHash) return;
      var frames = window.parent && window.parent.frames;
      if(!frames) return;
      for(var i=0;i<frames.length;i++){
        try{
          var loc = frames[i].location;
          if(loc && /print\.html/.test(loc.href)){
            if(loc.hash !== "#" + hash) loc.hash = hash;
            lastPrintHash = hash;
            break;
          }
        }catch(e){}
      }
    }catch(e){}
  }

  function render(){
    var rows = "";
    rows += rowHTML("Reason for Your Inquiry", values.reason);
    rows += rowHTML("Current Insurance Status", values.status);
    /* Provider rows added 2026-11-01 (TAX caught them missing):
       q62 is a dropdown and q63 a short text — both read directly,
       no mirror needed. Each hides when unanswered, so the
       uninsured paths never show them. */
    rows += rowHTML("Current Health Insurance Provider", values.provider);
    rows += rowHTML("Please Specify", values.providerOther);
    rows += rowHTML("Coverage Requested For", values.people);
    rows += rowHTML("ZIP Code", values.zip);
    rows += rowHTML("County", values.county);
    rows += rowHTML("Estimated Annual Household Income", values.income);
    rows += rowHTML("Tax Household Size", values.taxHousehold);
    rows += rowHTML("What Matters Most", values.priorities, true);
    rows += rowHTML("Are you interested in exploring additional coverage?", values.addonGate);
    rows += rowHTML("Additional Coverage Preferences", values.addons, true);
    rows += rowHTML("Target Monthly Premium", values.premium);
    rows += rowHTML("Preferred Coverage Timeframe", values.timeframe);
    rows += rowHTML("Preferred Coverage Start Date", startDate());
    document.getElementById('rows').innerHTML = rows;

    var over = isOver45();
    var b = over ? BUBBLES.over45 : BUBBLES.within45;
    var bubble = document.getElementById('bubble');
    if(!isEmpty(values.timeframe)){
      document.getElementById('bubbleHeading').textContent = b.heading;
      document.getElementById('bubbleBody').textContent = b.body;
      bubble.style.display = "";
    } else {
      bubble.style.display = "none";
    }

    var contact = "";
    contact += rowHTML("Name", values.fullName);
    contact += rowHTML("Phone Number", values.phone);
    contact += rowHTML("E-mail", values.email);
    if(!over) contact += rowHTML("Appointment Details", values.appointment);
    document.getElementById('contactRows').innerHTML = contact;

    var referral = "";
    referral += rowHTML("Referred By", values.referredBy);
    referral += rowHTML("Phone Number", values.referrerPhone);
    document.getElementById('referralRows').innerHTML = referral;

    document.getElementById('loadingMsg').style.display = "none";
    document.getElementById('content').style.display = "";
    updatePrintFrame();
    resize();
  }

  function absorb(data){
    if(!data) return;
    if(Array.isArray(data)){
      data.forEach(function(item){
        if(item && typeof item === "object"){
          var sel = item.selector || item.name || item.id;
          Object.keys(NAMES).forEach(function(k){
            if(NAMES[k] === sel && !isEmpty(item.value)) values[k] = toText(item.value);
          });
        }
      });
      return;
    }
    if(typeof data === "object"){
      if(data.data){ absorb(data.data); return; }
      Object.keys(data).forEach(function(sel){
        Object.keys(NAMES).forEach(function(k){
          if(NAMES[k] === sel && !isEmpty(data[sel])) values[k] = toText(data[sel]);
        });
      });
    }
  }
  function refresh(){
    if(!window.JFCustomWidget) return;
    var names = Object.keys(NAMES).map(function(k){ return NAMES[k]; });
    try{
      JFCustomWidget.getFieldsValueByName(names, function(d){ absorb(d); render(); });
    }catch(e){ render(); }
    setTimeout(render, 400);
  }

  if(window.JFCustomWidget && typeof JFCustomWidget.subscribe === "function"){
    JFCustomWidget.subscribe("ready", function(){
      // Fallback: catch calendar dates live if their mirrors ever miss.
      ["72","73"].forEach(function(qid){
        try{
          JFCustomWidget.listenFromField("input_"+qid, "change", function(p){
            if(!isEmpty(p)) calendarEvt[qid] = p;
            render();
          });
        }catch(e){}
      });
      refresh();
      setTimeout(refresh, 1200);
      /* Keep the card live: if the person goes back and changes an
         answer, the mirrors update but no bridge event reaches this
         frame — poll so the review always reflects the latest answers. */
      setInterval(refresh, 2500);
    });
    document.addEventListener("visibilitychange", function(){ if(!document.hidden) refresh(); });
    window.addEventListener("focus", refresh);
  } else {
    document.getElementById('loadingMsg').textContent = "Open this review inside the form to see your answers.";
  }
})();
</script>
</body>
</html>
