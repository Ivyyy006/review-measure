<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Measure v2 — diagnostic (clone only)</title>
<style>
  html,body{margin:0;padding:0;background:#fff;color:#1a1a1a;font-family:Arial,sans-serif;}
  #wrap{padding:10px;}
  h1{font-size:15px;margin:0 0 6px;}
  h2{font-size:13px;margin:12px 0 4px;}
  #status{font-size:13px;margin:0 0 8px;color:#444;}
  button{font-size:13px;padding:6px 12px;margin:0 6px 8px 0;cursor:pointer;}
  table{border-collapse:collapse;width:100%;font-size:12px;}
  th,td{border:1px solid #bbb;padding:3px 5px;vertical-align:top;text-align:left;}
  th{background:#eee;}
  td.qid{font-weight:bold;white-space:nowrap;}
  td.val{font-family:Menlo,Consolas,monospace;word-break:break-word;white-space:pre-wrap;}
  tr.empty td{color:#999;}
  #rawlog{font-family:Menlo,Consolas,monospace;font-size:11px;white-space:pre-wrap;word-break:break-word;border:1px solid #bbb;padding:6px;background:#fafafa;max-height:400px;overflow:auto;}
</style>
<script src="https://cdn.jotfor.ms/s/umd/latest/for-custom-widgets.js"></script>
</head>
<body>
<div id="wrap">
  <h1>Review Measure v2 — field read diagnostic (CLONE ONLY)</h1>
  <p id="status">Waiting for Jotform ready…</p>
  <button id="rescan" type="button">RE-SCAN</button>
  <h2>Raw bridge replies (verbatim)</h2>
  <div id="rawlog">(none yet)</div>
  <h2>Normalized results</h2>
  <table>
    <thead><tr><th>QID</th><th>Returned value (JSON)</th><th>Type</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<script>
(function(){
  "use strict";
  var MAX_ID = 140;
  var KNOWN = ["33","62","63","56","28"];
  var statusEl = document.getElementById('status');
  var rowsEl = document.getElementById('rows');
  var rawEl = document.getElementById('rawlog');
  var results = {};   // normalized qid -> {present, text, type}
  var rawLines = [];
  var connected = false;

  function resize(){
    try{
      if(window.JFCustomWidget && JFCustomWidget.requestFrameResize){
        JFCustomWidget.requestFrameResize({ height: Math.ceil(document.body.getBoundingClientRect().height) + 24 });
      }
    }catch(e){}
  }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function stringify(v){ try{ return JSON.stringify(v); }catch(e){ return String(v); } }

  function logRaw(tag, data){
    rawLines.push(tag + " => " + stringify(data).slice(0, 900));
    if(rawLines.length > 40) rawLines.shift();
    rawEl.textContent = rawLines.join("\n\n");
  }

  // Accept every documented/observed shape: keyed object with keys
  // "input_<qid>" | "<qid>" | "id_<qid>", or array of {id|name|fieldId, value}.
  function absorb(data){
    if(!data) return;
    if(Array.isArray(data)){
      data.forEach(function(item){
        if(item && typeof item === "object"){
          var k = item.id || item.name || item.fieldId;
          if(k != null) store(k, (item.value !== undefined ? item.value : item));
        }
      });
      return;
    }
    if(typeof data === "object"){
      Object.keys(data).forEach(function(k){ store(k, data[k]); });
    }
  }
  function store(rawKey, v){
    var k = String(rawKey).replace(/^input_/, "").replace(/^id_/, "").replace(/^q/, "");
    if(!/^\d+$/.test(k)) return;
    var present = !(v === null || v === undefined || v === "" ||
      (typeof v === "object" && Object.keys(v).length === 0));
    // Prefer a present value over an empty one for the same qid.
    if(results[k] && results[k].present && !present) return;
    results[k] = { present: present, text: stringify(v).slice(0,400),
      type: (v === null ? "null" : (Array.isArray(v) ? "array" : typeof v)) };
  }

  function render(){
    var html = "", found = 0;
    for(var id=1; id<=MAX_ID; id++){
      var r = results[String(id)];
      if(r && r.present) found++;
      html += '<tr class="'+((r&&r.present)?'':'empty')+'">'
        + '<td class="qid">'+id+'</td>'
        + '<td class="val">'+(r? esc(r.text) : '—')+'</td>'
        + '<td>'+(r? esc(r.type) : '—')+'</td></tr>';
    }
    rowsEl.innerHTML = html;
    statusEl.textContent = 'Scan complete. Fields returning data: '+found+'. Last scan: '+new Date().toLocaleTimeString();
    resize();
  }

  function callById(ids, tag, done){
    try{
      JFCustomWidget.getFieldsValueById(ids, function(d){ logRaw(tag, d); absorb(d); done && done(); });
    }catch(e){ logRaw(tag+" ERROR", String(e)); done && done(); }
  }

  function scan(){
    if(!connected){ statusEl.textContent = 'Not connected yet.'; return; }
    statusEl.textContent = 'Scanning…';
    results = {};
    var queue = [];
    // 1) Known IDs, one at a time, raw reply logged.
    KNOWN.forEach(function(id){ queue.push({ ids:[id], tag:'single['+id+']' }); });
    // 2) Sweep in batches of 10.
    for(var s=1; s<=MAX_ID; s+=10){
      var b = [];
      for(var i=s; i<s+10 && i<=MAX_ID; i++) b.push(String(i));
      queue.push({ ids:b, tag:'batch['+b[0]+'-'+b[b.length-1]+']' });
    }
    var idx = 0;
    (function next(){
      if(idx >= queue.length){ render(); return; }
      var q = queue[idx++];
      callById(q.ids, q.tag, next);
    })();
  }

  document.getElementById('rescan').addEventListener('click', scan);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) scan(); });
  window.addEventListener('focus', scan);

  if(window.JFCustomWidget && typeof JFCustomWidget.subscribe === 'function'){
    JFCustomWidget.subscribe('ready', function(){
      connected = true;
      statusEl.textContent = 'Connected (UMD bridge). Running first scan…';
      scan();
      setTimeout(scan, 2000);
    });
  } else {
    statusEl.textContent = 'JFCustomWidget unavailable — open inside a Jotform form.';
  }
})();
</script>
</body>
</html>
